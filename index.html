<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbit Plotter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="site-name">Orbit Plotter</div>
      <nav>
        <a href="index.html" class="active">Plotting</a>
        <a href="learning.html">Learning</a>
        <a href="resources.html">Resources</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="layout">
      <div class="controls panel-box">
        <div class="type-section">
          <h3>Type of Orbit</h3>
          <select id="orbitType" name="orbitType">
            <option value="2body">2 Body</option>
            <option value="cr3bp">CR3BP</option>
            <option value="relativemotion">Relative Motion</option>
          </select>
        </div>
        <div class="inputs-fields">
          <!-- Dynamic inputs render here -->
        </div>
        <button type="button" id="runBtn" class="run-btn">Run Simulation</button>
      </div>

      <div class="center panel-box">
        <div class="main-plot">
          <div id="mainPlot"></div>
        </div>
      </div>

      <div class="diagnostics">
        <div class="conserved panel-box">
          <h3>Conserved Quantity Error</h3>
          <div id="conservedPlot"></div>
          <p class="conserved-note">Run a simulation to see the expected error for that propagation method.</p>
        </div>
        <div class="examples-panel panel-box">
          <h3>Examples</h3>
          <div class="examples-list" id="examplesList">
            <!-- Populated by app.js based on the selected orbit type -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>Made By: <a href="https://taylorspace.net" target="_blank" rel="noopener">Josh Taylor</a> and Zack Fraser</p>
    <p>Contact Us: orbitplotter@gmail.com</p>
  </footer>

  <!-- ===== JS Libraries ===== -->
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <script src="physics.js"></script>
  <script src="app.js"></script>
</body>
</html>
